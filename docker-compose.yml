version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gradesense_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gradesense_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gradesense_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-gradesense_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/app/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/app/db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradesense_user -d gradesense_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gradesense_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gradesense_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-gradesense_user}:${POSTGRES_PASSWORD:-gradesense_secret_password}@postgres:5432/${POSTGRES_DB:-gradesense_db}
      - SECRET_KEY=${SECRET_KEY:-super_secret_jwt_key_for_industrial_gradesense_ai_2026}
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - ALLOWED_ORIGINS=http://localhost,http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gradesense_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: gradesense_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
